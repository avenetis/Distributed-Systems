server:
  port: 8083

spring:
  application:
    name: worker-service

worker:
  id: ${WORKER_ID:${HOSTNAME:worker-local}}
  address: ${WORKER_ADDRESS:http://localhost:8083}
  auth-token: ${WORKER_AUTH_TOKEN:dev-worker-token-change-me}

manager:
  url: ${MANAGER_URL:http://manager-service.mapreduce-system.svc.cluster.local:8080}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}

logging:
  level:
    root: INFO
    com.tuc.distributed.worker: DEBUG
