server:
  port: 8083

spring:
  application:
    name: worker-service

worker:
  id: ${WORKER_ID:${HOSTNAME:worker-local}}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}

logging:
  level:
    root: INFO
    com.tuc.distributed.worker: INFO
