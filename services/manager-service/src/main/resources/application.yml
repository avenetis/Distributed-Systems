server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: manager-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:mapreduce}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/mapreduce}
    username: ${SPRING_DATASOURCE_USERNAME:mapreduce}
    password: ${SPRING_DATASOURCE_PASSWORD:mapreduce}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
    show-sql: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

manager:
  worker-auth-token: ${WORKER_AUTH_TOKEN:dev-worker-token-change-me}
  callback:
    url: ${MANAGER_CALLBACK_URL:http://localhost:8091/internal/v1/callbacks/task-complete}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    input: mapreduce-input
    intermediate: mapreduce-intermediate
    output: mapreduce-output
    code: mapreduce-code

logging:
  level:
    com.mapreduce.manager: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

job:
  default:
    num-mappers: 4
    num-reducers: 2
  task:
    timeout-seconds: 300
    max-retries: 3
  worker:
    heartbeat-interval-seconds: 10
    heartbeat-timeout-seconds: 30