server:
  port: 8081

spring:
  application:
    name: manager-service
  
  datasource:
    url: jdbc:h2:mem:mapreduce_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1000ms

minio:
  enabled: false
  endpoint: http://localhost:9000
  access-key: dummy
  secret-key: dummy

logging:
  level:
    com.mapreduce.manager: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info