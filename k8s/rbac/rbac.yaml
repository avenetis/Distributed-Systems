## ServiceAccount for the ManagerService
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager-sa
  namespace: mapreduce-system
---
## Role in the mapreduce-workers namespace, this allows the manager to create/manage k8s jobs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-job-controller
  namespace: mapreduce-workers
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
## RoleBinding to the manager-sa ServiceAccount (bound in the mapreduce-system namespace) to the Role in the mapreduce-workers namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manager-job-controller-binding
  namespace: mapreduce-workers
subjects:
- kind: ServiceAccount
  name: manager-sa
  namespace: mapreduce-system
roleRef:
  kind: Role
  name: manager-job-controller
  apiGroup: rbac.authorization.k8s.io

