apiVersion: v1
kind: Service
metadata:
  name: ui-service
  namespace: mapreduce-system
spec:
  selector:
    app: ui-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080       # external port on the minikube node
  type: NodePort            # accessible from outside the cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
  namespace: mapreduce-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
    spec:
      containers:
      - name: ui-service
        image: ui-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: MANAGER_URL
          value: "http://manager-service.mapreduce-system.svc.cluster.local:8080"