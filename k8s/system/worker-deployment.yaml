apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: mapreduce-workers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      containers:
      - name: worker
        image: worker-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: WORKER_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: worker-auth-secret
              key: worker-token
        - name: WORKER_ADDRESS
          value: "http://worker-service.mapreduce-workers.svc.cluster.local:8083"
        - name: MANAGER_URL
          value: "http://manager-service.mapreduce-system.svc.cluster.local:8080"
        - name: MINIO_ENDPOINT
          value: "http://minio.mapreduce-infra.svc.cluster.local:9000"
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          value: "minioadmin123"
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
  namespace: mapreduce-workers
spec:
  selector:
    app: worker-service
  ports:
  - protocol: TCP
    port: 8083
    targetPort: 8083
  type: ClusterIP