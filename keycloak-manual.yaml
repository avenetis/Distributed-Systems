apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: mapreduce-infra
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: mapreduce-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0.5
        args: ['start-dev', '--http-enabled=true', '--hostname-strict=false']
        env:
        - name: KEYCLOAK_ADMIN
          value: 'admin'
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: 'admin'
        - name: KC_DB
          value: 'postgres'
        - name: KC_DB_URL
          value: 'jdbc:postgresql://10.107.63.32:5432/mapreduce'
        - name: KC_DB_USERNAME
          value: 'mapreduce'
        - name: KC_DB_PASSWORD
          value: 'minioadmin123'
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: '512Mi'
          limits:
            memory: '1024Mi'
